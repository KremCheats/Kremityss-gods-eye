workflows:
  kremityss-ios:
    name: Kremityss Live iOS unsigned
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        EXPO_PUBLIC_WEBSITE_URL: https://kremityss-gods-eye.manus.space
      node: 22.13.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: |
          cd mobile
          npm ci
      - name: Generate the native iOS project
        script: |
          cd mobile
          npx expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods dependencies
        script: |
          cd mobile/ios
          pod install
      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/mobile/ios/KremityssLive.xcworkspace" \
            -scheme "KremityssLive" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        notify:
          success: true
          failure: true
