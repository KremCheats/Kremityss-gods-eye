workflows:
  kremityss-ios:
    name: Kremityss Live iOS Release unsigned
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        EXPO_PUBLIC_WEBSITE_URL: https://kremityss-gods-eye.manus.space
      node: 22.13.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: |
          cd mobile
          npm ci
      - name: Generate the native iOS project
        script: |
          cd mobile
          npx expo prebuild --platform ios --no-install --clean
      - name: Bundle the production JavaScript
        script: |
          cd mobile
          npx expo export --platform ios
      - name: Install CocoaPods dependencies
        script: |
          cd mobile/ios
          pod install
      - name: Build unsigned Release iOS app
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/mobile/ios/KremityssLive.xcworkspace" \
            -scheme "KremityssLive" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify embedded JavaScript bundle
        script: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Release-iphoneos/KremityssLive.app' -type d -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/main.jsbundle" || test -f "$APP_PATH/_expo/static/js/ios/main.js"
          ! find "$APP_PATH" -maxdepth 1 -name '*.debug.dylib' -print | grep -q .
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
